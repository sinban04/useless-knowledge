<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="430" fill="#ffffff"/>
  <line x1="400" y1="30" x2="400" y2="400" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- ================= left: Newton ================= -->
  <text x="200" y="44" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle">뉴턴 — x, y, 장력 T, 구속조건</text>
  <line x1="120" y1="80" x2="280" y2="80" stroke="#475569" stroke-width="3"/>
  <line x1="200" y1="80" x2="285" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="285" cy="300" r="13" fill="#334155"/>
  <!-- forces -->
  <line x1="285" y1="300" x2="285" y2="385" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 285 392 L 280 380 L 290 380 Z" fill="#dc2626"/>
  <text x="296" y="382" font-size="13.5" fill="#dc2626">mg</text>
  <line x1="285" y1="300" x2="234" y2="168" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 231 161 L 228 174 L 238 170 Z" fill="#2563eb"/>
  <text x="212" y="182" font-size="13.5" fill="#2563eb">T = ?</text>
  <line x1="285" y1="300" x2="285" y2="230" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="285" y1="300" x2="230" y2="300" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="132" y="345" font-size="13" fill="#64748b">구속: x² + y² = ℓ²</text>
  <text x="132" y="368" font-size="13" fill="#64748b">미지수 x, y, T — 셋을 연립</text>
  <!-- ================= right: Lagrange ================= -->
  <text x="600" y="44" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle">라그랑주 — 좌표는 θ 하나</text>
  <line x1="520" y1="80" x2="680" y2="80" stroke="#475569" stroke-width="3"/>
  <line x1="600" y1="80" x2="600" y2="310" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="600" y1="80" x2="685" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="685" cy="300" r="13" fill="#0d9488"/>
  <path d="M 600 170 A 90 90 0 0 1 634 162" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <text x="622" y="150" font-size="15" fill="#0d9488" font-weight="600">θ</text>
  <text x="512" y="345" font-size="13" fill="#64748b">L = ½mℓ²θ̇² + mgℓcosθ</text>
  <text x="512" y="368" font-size="13" fill="#64748b">→ θ̈ = −(g/ℓ)sinθ — 장력은 등장하지 않음</text>
</svg>
