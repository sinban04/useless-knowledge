<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <!-- left: at rest -->
  <text x="160" y="44" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle">정지한 시계</text>
  <line x1="95" y1="90" x2="225" y2="90" stroke="#475569" stroke-width="5"/>
  <line x1="95" y1="330" x2="225" y2="330" stroke="#475569" stroke-width="5"/>
  <line x1="160" y1="96" x2="160" y2="324" stroke="#d97706" stroke-width="3"/>
  <path d="M 160 100 L 155 112 L 165 112 Z" fill="#d97706"/>
  <path d="M 160 320 L 155 308 L 165 308 Z" fill="#d97706"/>
  <text x="160" y="368" font-size="13.5" fill="#64748b" text-anchor="middle">왕복 1회 = 1틱</text>
  <!-- right: moving -->
  <text x="565" y="44" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle">움직이는 시계 (옆에서 보면)</text>
  <g stroke="#cbd5e1" stroke-width="4">
    <line x1="360" y1="90" x2="470" y2="90"/><line x1="360" y1="330" x2="470" y2="330"/>
    <line x1="510" y1="90" x2="620" y2="90"/><line x1="510" y1="330" x2="620" y2="330"/>
    <line x1="660" y1="90" x2="770" y2="90"/><line x1="660" y1="330" x2="770" y2="330"/>
  </g>
  <path d="M 415 324 L 565 96 L 715 324" fill="none" stroke="#d97706" stroke-width="3"/>
  <circle cx="415" cy="324" r="5" fill="#d97706"/>
  <circle cx="565" cy="96" r="5" fill="#d97706"/>
  <circle cx="715" cy="324" r="5" fill="#d97706"/>
  <line x1="415" y1="355" x2="715" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="565" y="376" font-size="13" fill="#64748b" text-anchor="middle">시계는 그 사이 v로 이동</text>
  <line x1="500" y1="392" x2="560 " y2="392" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 567 392 L 555 387 L 555 397 Z" fill="#2563eb"/>
  <text x="580" y="397" font-size="13.5" fill="#2563eb">v</text>
  <text x="565" y="70" font-size="13.5" fill="#b45309" text-anchor="middle">지그재그 — 경로가 길다 ÷ 같은 c = 틱이 길다</text>
</svg>
