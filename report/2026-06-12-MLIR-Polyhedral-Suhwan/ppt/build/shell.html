<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLIR · Polyhedral / Affine — 세미나</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/viz.css">
<style>
:root{
  --ink:#191b22; --ink2:#3a3e4d; --muted:#6b7180; --faint:#9aa0ad;
  --paper:#fbfaf7; --card:#ffffff; --line:#e7e3da; --line2:#d6d1c4;
  --mlir:#b5341f; --poly:#2f6f9f; --synth:#9a7b3f;
  --accent:var(--mlir);
  --serif:"Iowan Old Style","Apple Garamond",Georgia,"Noto Serif KR",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR",system-ui,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b1d24; font-family:var(--sans); color:var(--ink);
  overflow:hidden; display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased}
#stage{position:relative}
#deck{width:1280px; height:720px; position:relative; transform-origin:top left}   /* stage가 스케일된 덱 크기 — top left여야 덱이 stage를 정확히 채운다 */
.slide{position:absolute; inset:0; background:var(--paper); padding:54px 70px 52px;
  display:none; flex-direction:column; overflow:hidden; border-radius:6px; box-shadow:0 30px 80px rgba(0,0,0,.45)}
.slide.active{display:flex}
.slide[data-part=mlir]{--accent:var(--mlir)}
.slide[data-part=poly]{--accent:var(--poly)}
.slide[data-part=synth]{--accent:var(--synth)}
.slide::before{content:""; position:absolute; top:0; left:0; right:0; height:6px; background:var(--accent)}

.kicker{font-size:13.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
  font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:10px}
h1.s{font-size:38px; line-height:1.12; font-weight:800; letter-spacing:-.01em; color:var(--ink)}
h2.s{font-size:31px; line-height:1.15; font-weight:800; letter-spacing:-.01em; color:var(--ink); margin-bottom:4px}
.sub{font-size:18px; color:var(--muted); margin-top:12px; line-height:1.5; max-width:62ch}
.body{margin-top:14px; font-size:18px; line-height:1.6; color:var(--ink2); flex:1; min-height:0; overflow:hidden; display:flex; align-items:center;
  display:flex; flex-direction:column; justify-content:center}
.bodyinner{width:100%; transform-origin:center center}   /* fit-to-fill: 넘치면 통째로 scale */
.body.center{justify-content:center}
.lead{font-size:20px; line-height:1.5; color:var(--ink2); margin-bottom:10px}
em{color:var(--accent); font-style:normal; font-weight:700}
b,strong{font-weight:700; color:var(--ink)}
code{font-family:var(--mono); font-size:.9em; background:#efece4; padding:1px 6px; border-radius:5px; color:#7a2d1a}
.small{font-size:14px; color:var(--muted)}
.foot{position:absolute; left:70px; right:70px; bottom:20px; display:flex; justify-content:space-between;
  align-items:center; font-size:12px; color:var(--faint); border-top:1px solid var(--line); padding-top:8px}
.foot .pg{font-family:var(--mono)}

/* cover */
.cover{background:linear-gradient(150deg,#1b1d24 0%,#3a1d1a 60%,#5a241c 100%); color:#f4f1ea}
.cover::before{height:0}
.cover .wrap{margin:auto 0}
.cover .eyebrow{font-size:14px; letter-spacing:.3em; text-transform:uppercase; color:#e8a07a; font-weight:700}
.cover h1{font-family:var(--serif); font-size:72px; line-height:1.04; font-weight:800; margin:16px 0 8px; letter-spacing:-.02em}
.cover .en{font-size:24px; color:#cabfb6; font-weight:400; font-family:var(--serif); font-style:italic; line-height:1.4}
.cover .tags{display:flex; gap:10px; margin:32px 0 0}
.cover .tag{font-size:14px; padding:6px 15px; border-radius:30px; font-weight:700; color:#fff}
.cover .tag.t-mlir{background:var(--mlir)} .cover .tag.t-poly{background:var(--poly)} .cover .tag.t-synth{background:var(--synth)}
.cover .meta{margin-top:28px; font-size:15px; color:#a89e93; line-height:1.7}
.cover .strip{position:absolute; left:0; right:0; bottom:0; height:10px; display:flex}
.cover .strip span{flex:1}
.cover .strip .b-mlir{background:var(--mlir)} .cover .strip .b-poly{background:var(--poly)} .cover .strip .b-synth{background:var(--synth)}

/* divider */
.divider{justify-content:center; color:#f4f1ea}
.divider::before{height:0}
.divider .num{font-family:var(--serif); font-size:140px; font-weight:800; line-height:1; opacity:.9}
.divider h1{font-size:44px; font-weight:800; margin-top:2px; letter-spacing:-.01em}
.divider .d-sub{font-size:18px; color:rgba(255,255,255,.74); margin-top:14px; max-width:64ch; line-height:1.55}
.divider .rule{width:62px; height:5px; border-radius:3px; background:#fff; margin:22px 0 0}

/* layout */
.cols{display:grid; gap:28px; flex:1; min-height:0}
.c2{grid-template-columns:1fr 1fr}
.col{min-width:0; display:flex; flex-direction:column; justify-content:center}
.col.fig-col{justify-content:center; align-items:center}
.fig{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; width:100%}
.fig img{max-width:100%; max-height:430px; object-fit:contain; border-radius:8px; background:#fff; padding:8px}
figcaption{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.4; text-align:center}

ul.clean{list-style:none}
ul.clean li{position:relative; padding-left:24px; margin:9px 0; line-height:1.48}
ul.clean li::before{content:""; position:absolute; left:3px; top:9px; width:8px; height:8px; border-radius:50%; background:var(--accent)}
ol.num{list-style:none; counter-reset:n}
ol.num li{position:relative; padding-left:40px; margin:11px 0; line-height:1.48; counter-increment:n}
ol.num li::before{content:counter(n); position:absolute; left:0; top:-1px; width:27px; height:27px; background:var(--accent);
  color:#fff; border-radius:50%; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center}

table{width:100%; border-collapse:collapse; font-size:15px}
table.sm{font-size:14px} table.xs{font-size:12.6px}
th,td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--line)}
thead th{background:var(--ink); color:#fff; font-weight:700; font-size:13px; border:none}
tbody tr:nth-child(even){background:#f4f1ea}

.note{background:#fdf2ee; border-left:4px solid var(--accent); padding:13px 17px; border-radius:0 8px 8px 0;
  font-size:15.5px; line-height:1.5; color:var(--ink2); margin:10px 0}
.note.op{background:#fff7ec; border-color:#e8923a}
.note.op::first-line{font-weight:700}
.note.q{background:#eef5fb; border-color:var(--poly)}

.statement{font-family:var(--serif); font-size:30px; line-height:1.4; color:var(--ink); font-weight:600; margin:8px 0}
.statement em{font-style:italic; color:var(--accent); font-weight:700}

/* code */
.codeblock{background:#1d1f27; color:#e7e3d8; font-family:var(--mono); font-size:13.5px; line-height:1.5;
  padding:14px 18px; border-radius:10px; margin:8px 0; white-space:pre}   /* 높이 캡 없음 — fit-to-fill 이 전체 코드 보이게 맞춤 */
.codeblock code{background:none; color:inherit; padding:0; font-size:inherit}

/* math */
.eq{margin:10px 0; text-align:center; font-size:17px; overflow-x:auto}
.katex-display{margin:.4em 0}

/* diagrams — Cytoscape.js(+dagre) 그래프 (LR 방향 + fit-to-fill 이 크게 맞춤) */
figure.diagram{margin:4px 0; width:100%}   /* flex fig-col(align-items:center)에서 폭 수축 방지 */
figure.diagram .cy{width:100%; height:320px; background:none}
.col.fig-col figure.diagram .cy{height:360px}
figure.diagram .cy-err{font-family:var(--mono); font-size:13px; color:var(--accent); text-align:center; padding:1rem}
/* viz-only 슬라이드(텍스트 없음): 비주얼이 빈 화면에 떠 보이지 않게 가용 높이를 채운다 */
.slide.vizonly figure.diagram .cy{height:505px}
.slide.vizonly .fig img{max-height:520px}
.slide.vizonly pre.codeblock{font-size:17.5px; line-height:1.7}
.slide.vizonly table{margin-left:auto; margin-right:auto}
pre.mermaid{margin:4px 0; text-align:center; background:none; line-height:initial}  /* fallback: 비-그래프 */
/* 애니메이션 위젯은 자연 높이가 커서 fit-to-fill로 0.6~0.8x 축소된다 — 내부 글자를 키워 보상 */
.vizbox .pv-caption{font-size:18px}
.vizbox .pv-codecard pre{font-size:15px}
.vizbox .pv-caption code{font-size:15px}

/* animation box */
/* 높이 제약 없음 — vizbox 가 자연 높이(canvas+aux+controls, ~850px)를 갖게 둬야
   bodyinner.scrollHeight 가 실제값으로 측정돼 fit-to-fill 이 발동한다.
   (max-height 로 clamp 하면 캔버스가 박스 밖으로 넘쳐 painting되며 슬라이드에서 잘림) */
.vizwrap{width:100%}
.vizbox{width:100%; position:relative}
.vizph{display:flex; align-items:center; justify-content:center; height:420px; color:var(--muted);
  font-family:var(--mono); font-size:14px; border:1.5px dashed var(--line2); border-radius:12px}

/* HUD */
#progress{position:fixed; top:0; left:0; height:3px; background:var(--mlir); z-index:50; transition:width .25s}
#hud{position:fixed; bottom:14px; right:18px; z-index:50; display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:12px; color:#cfc9bd}
#hud button{background:rgba(255,255,255,.08); color:#e8e3d8; border:1px solid rgba(255,255,255,.14); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px}
#hud button:hover{background:rgba(255,255,255,.18)}
#hud a{background:rgba(255,255,255,.08); color:#e8e3d8; border:1px solid rgba(255,255,255,.14); height:30px; padding:0 11px; border-radius:8px; display:inline-flex; align-items:center; text-decoration:none; font-size:12px; gap:5px}
#hud a:hover{background:rgba(255,255,255,.18)}
#counter{background:rgba(0,0,0,.35); padding:6px 12px; border-radius:20px}
#hint{position:fixed; bottom:16px; left:18px; z-index:50; font-family:var(--mono); font-size:11.5px; color:#7d7972; opacity:.8}
#overview{position:fixed; inset:0; background:#15171d; z-index:100; display:none; overflow-y:auto; padding:34px}
#overview.on{display:block}
#overview h3{color:#e8e3d8; font-size:16px; margin-bottom:18px}
.ovgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px}
.ovcell{aspect-ratio:16/9; background:#23262e; border:2px solid transparent; border-radius:8px; cursor:pointer; overflow:hidden; position:relative; padding:10px; color:#d8d3c8}
.ovcell:hover{border-color:var(--mlir)}
.ovcell .ovn{font-family:var(--mono); font-size:11px; color:#8a8578}
.ovcell .ovt{font-size:12px; font-weight:700; margin-top:4px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.ovcell .ovbar{position:absolute; left:0; top:0; bottom:0; width:4px}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage"><div id="deck">
<!--SLIDES-->
</div></div>

<div id="hud">
  <a href="../site/index.html" title="같은 내용의 스크롤 멀티페이지판으로">📜 스크롤판</a>
  <button id="btnPrev" title="이전 (←)">‹</button>
  <span id="counter">1 / 1</span>
  <button id="btnNext" title="다음 (→)">›</button>
  <button id="btnGrid" title="개요 (O / Esc)">▦</button>
</div>
<div id="hint">← → 이동 · 휠 확대 · 🔍 그림확대 · 0 화면맞춤 · P 펜 · O 개요 · F 전체화면</div>
<div id="overview"><h3>슬라이드 개요 — 클릭하여 이동 (Esc 닫기)</h3><div class="ovgrid" id="ovgrid"></div></div>

<script src="assets/cytoscape.min.js"></script>
<script src="assets/dagre.min.js"></script>
<script src="assets/cytoscape-dagre.min.js"></script>
<script src="assets/cyto.js?v=20260611a"></script>
<script src="assets/zoom.js?v=20260611d"></script>
<script src="assets/katex/katex.min.js"></script>
<script src="assets/katex/auto-render.min.js"></script>
<script src="assets/poly.js"></script>
<script src="assets/viz-scenes.js"></script>
<script>
(function(){
  // mermaid init (render per-slide, not on load)
  if(window.mermaid){ try{ window.mermaid.initialize({startOnLoad:false, securityLevel:"loose", theme:"neutral",
      themeVariables:{fontFamily:'"Iowan Old Style",Georgia,"Noto Serif KR",serif', fontSize:"15px"},
      flowchart:{curve:"basis", htmlLabels:true, padding:10, useMaxWidth:true}}); }catch(e){console.warn("mermaid init",e);} }

  const deck=document.getElementById('deck');
  const slides=Array.from(deck.querySelectorAll('.slide'));
  const stage=document.getElementById('stage');
  const counter=document.getElementById('counter');
  const progress=document.getElementById('progress');
  const overview=document.getElementById('overview');
  const ovgrid=document.getElementById('ovgrid');
  const N=slides.length;
  let cur=0;

  slides.forEach((s,k)=>{ const f=s.querySelector('.foot .pg'); if(f) f.textContent=(k+1)+' / '+N; });

  function mountViz(box){
    if(box.dataset.mounted) return; box.dataset.mounted="1";
    box.addEventListener('click', function(e){ e.stopPropagation(); }); // 애니 조작 클릭이 슬라이드 넘김 안 되게
    const slug=box.getAttribute("data-scene");
    const scene=window.POLY_SCENES&&window.POLY_SCENES[slug];
    if(!scene||!window.PolyViz){ box.innerHTML='<div class="vizph">애니메이션 로드 실패: '+slug+'</div>'; return; }
    box.innerHTML=""; try{ window.PolyViz.mount(box,scene); }
    catch(e){ console.warn("PolyViz",slug,e); box.innerHTML='<div class="vizph">로드 실패: '+slug+'</div>'; }
  }
  // fit-to-fill: 본문이 슬라이드 가용 영역을 넘치면, 비주얼이 잘리지 않게 통째로 '가용 영역에 꽉 차게' 스케일.
  // (축소 아님 — 슬라이드가 허용하는 최대 크기로 채움. LR 다이어그램·전용 슬라이드와 결합해 크게 보임.)
  function fitInner(inner){
    if(!inner) return; const body=inner.parentElement; if(!body) return;
    inner.style.transform='none';
    const aw=body.clientWidth, ah=body.clientHeight, nw=inner.scrollWidth, nh=inner.scrollHeight;
    if(!ah||!nh) return;
    const sc=Math.min(1, ah/nh, (aw&&nw)?aw/nw:1);
    inner.style.transform = sc<0.995 ? 'scale('+sc.toFixed(4)+')' : 'none';
  }
  function fitSlide(slide){ if(slide) fitInner(slide.querySelector('.bodyinner')); }
  const roFit = ('ResizeObserver' in window) ? new ResizeObserver(function(es){ es.forEach(function(e){ fitInner(e.target); }); }) : null;

  function renderAssets(slide){
    if(!slide||slide.dataset.assetsDone) return; slide.dataset.assetsDone="1";
    if(window.renderMathInElement){ try{ window.renderMathInElement(slide,{
        delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
        ignoredTags:["script","noscript","style","textarea","pre","code","option"], throwOnError:false}); }catch(e){} }
    const inner=slide.querySelector('.bodyinner');
    const done=function(){
      slide.querySelectorAll('.vizbox[data-scene]').forEach(mountViz);
      if(roFit&&inner) roFit.observe(inner);   // mermaid/애니 비동기 사이즈 변화 시 자동 re-fit
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ fitSlide(slide); }); });
      // poly.js 는 canvas 높이를 rAF draw 시점에 px로 박으므로 늦게 커질 수 있다 → 백스톱 re-fit
      setTimeout(function(){ fitSlide(slide); }, 250);
      setTimeout(function(){ fitSlide(slide); }, 700);
    };
    // Cytoscape 그래프를 이 슬라이드가 보일 때 렌더(숨은 슬라이드는 컨테이너 크기가 0이라 보류됨)
    if(window.SeminarCyto){ try{ window.SeminarCyto.renderIn(slide); }catch(e){ console.warn("cyto",e); } }
    done();
  }

  function fit(){ const m=24; const sc=Math.min((innerWidth-m)/1280,(innerHeight-m)/720);
    deck.style.transform='scale('+sc+')'; stage.style.width=(1280*sc)+'px'; stage.style.height=(720*sc)+'px'; }
  function show(i){ cur=Math.max(0,Math.min(N-1,i));
    slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
    counter.textContent=(cur+1)+' / '+N; progress.style.width=((cur+1)/N*100)+'%'; location.hash=cur+1;
    renderAssets(slides[cur]); fitSlide(slides[cur]);
    window.dispatchEvent(new CustomEvent('deck:show',{detail:{cur:cur}})); }
  function next(){show(cur+1);} function prev(){show(cur-1);}
  // present.js(발표 오버레이: 슬라이드 확대 + 펜 드로잉)가 후킹할 deck API
  window.SeminarDeck={ deck:deck, stage:stage, get cur(){return cur;}, count:N, fit:fit, show:show, next:next, prev:prev };

  document.getElementById('btnNext').onclick=next;
  document.getElementById('btnPrev').onclick=prev;
  document.getElementById('btnGrid').onclick=toggleOv;
  document.addEventListener('keydown',e=>{
    if(overview.classList.contains('on')){ if(e.key==='Escape'||e.key==='o'||e.key==='O') toggleOv(); return; }
    switch(e.key){
      case 'ArrowRight': case ' ': case 'PageDown': next(); e.preventDefault(); break;
      case 'ArrowLeft': case 'PageUp': prev(); e.preventDefault(); break;
      case 'Home': show(0); break; case 'End': show(N-1); break;
      case 'o': case 'O': toggleOv(); break;
      case 'f': case 'F': if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); break;
    }
  });
  // 클릭=슬라이드 넘김은 present.js 가 담당 — 그래프·그림 위 클릭/드래그·확대 중에는 넘기지 않도록 분리

  slides.forEach((s,k)=>{
    const cell=document.createElement('div'); cell.className='ovcell';
    let title='';
    if(s.classList.contains('cover')) title=(s.querySelector('h1')||{}).textContent||'Title';
    else if(s.classList.contains('divider')) title=(s.querySelector('h1')||{}).textContent||'';
    else { const h1=s.querySelector('h2.s,h1.s'); const k1=s.querySelector('.kicker'); title=(h1?h1.textContent:(k1?k1.textContent:'')); }
    const part=s.dataset.part||'mlir'; const col=part==='poly'?'var(--poly)':part==='synth'?'var(--synth)':'var(--mlir)';
    cell.innerHTML='<span class="ovbar" style="background:'+col+'"></span><div class="ovn">'+(k+1)+'</div><div class="ovt">'+title+'</div>';
    cell.onclick=()=>{ show(k); toggleOv(); }; ovgrid.appendChild(cell);
  });
  function toggleOv(){ overview.classList.toggle('on'); }

  addEventListener('resize',fit); fit();
  const h=parseInt(location.hash.replace('#','')); show(isNaN(h)?0:h-1);
  // 폰트 로드 후 현재 슬라이드 re-fit (mermaid 라벨 폭이 실폰트로 바뀌며 크기 변동 → ResizeObserver도 잡지만 backstop)
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ fitSlide(slides[cur]); }); }
})();
</script>
<script src="assets/present.js?v=20260612a"></script>
</body>
</html>
